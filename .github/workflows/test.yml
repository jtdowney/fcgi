name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.16"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam format --check src test

  test:
    name: "Gleam ${{ matrix.gleam-version }} (OTP ${{ matrix.otp-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp-version: ["27", "28", "29"]
        gleam-version: ["1.15", "1.16"]
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp-version }}
          gleam-version: ${{ matrix.gleam-version }}
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.16"
          rebar3-version: "3"
      - working-directory: examples/wisp_hello
        run: gleam format --check src
      - working-directory: examples/wisp_hello
        run: gleam build
      - working-directory: examples/sse
        run: gleam format --check src
      - working-directory: examples/sse
        run: gleam build
